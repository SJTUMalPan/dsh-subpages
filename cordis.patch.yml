# dsh-subpages bundle patch（package.json 的 dsh.bundle.patch 指向本文件）
#
# 这个文件是本插件作为一个 profile 层级的全部声明：一行 insert。
# 通过官方 CLI 安装时（dsh plugin --profile web add <spec>），`dsh plugin` 会把包名
# 追加进 profile 的 dsh.profile.bundles —— 不需要手改 profile 任何文件。
#
# 可选配置（也可用环境变量覆盖，见 README「配置」）：
#
#   - insert:
#       - id: subpages
#         name: dsh-subpages
#         config:
#           mountPath: /subpages      # 网关前缀，默认 /subpages
#           pagesDirs: []             # 额外的看板目录（绝对路径），默认只用包内 pages/
#           requestTimeoutMs: 15000   # 转发到看板的超时
#
- insert:
    - id: subpages
      name: dsh-subpages
      config:
        # 每次 DSH 启动把「带 token 的访问链接」投递到 notify-hub（进而转发到飞书）。
        # 凭据不新增：直接从 notify-hub 自己的 config.yaml 里读。
        startupNotice:
          enabled: true
          publicHost: 47.109.102.36                 # 对外主机（IP 或域名）
          tokenFile: /root/notify-hub-run/config.yaml
          tokenPath: server.auth_token
          logPath: /tmp/dsh-web.log                 # 启动横幅所在文件（run-dsh.sh 重定向到此）
